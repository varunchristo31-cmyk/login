<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;

        /* Background Image */
        background:
            linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600');

        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;
    }

    .container{
        width:900px;
        height:500px;
        display:flex;
        border-radius:12px;
        overflow:hidden;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
        background:#fff;
    }

    /* Left Side Image */
    .left{
        flex:1;
    }

    .left img{
        width:100%;
        height:100%;
        object-fit:cover;
    }

    /* Right Side Form */
    .right{
        flex:1;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:40px;
        background:#fff;
    }

    .login-form{
        width:100%;
        max-width:320px;
    }

    .login-form h2{
        text-align:center;
        margin-bottom:25px;
        letter-spacing:2px;
    }

    .input-group{
        margin-bottom:15px;
    }

    .input-group input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:5px;
        outline:none;
    }

    .remember{
        display:flex;
        align-items:center;
        gap:8px;
        margin-bottom:20px;
        font-size:14px;
    }

    .login-btn{
        width:100%;
        padding:12px;
        border:none;
        background:#007bff;
        color:#fff;
        font-size:16px;
        border-radius:5px;
        cursor:pointer;
    }

    .login-btn:hover{
        background:#0056b3;
    }

    /* Responsive */
    @media(max-width:768px){
        .container{
            flex-direction:column;
            width:90%;
            height:auto;
        }

        .left{
            height:200px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- Left Image -->
    <div class="left">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=900" alt="Login Image">
    </div>

    <!-- Right Form -->
    <div class="right">
        <form class="login-form">
            <h2>LOGIN</h2>

            <div class="input-group">
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Enter your password" required>
            </div>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Remember Me</label>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

</div>

</body>
</html>
